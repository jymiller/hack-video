# Render blueprint for the submission artifact — NOT the demo.
#
# The demo runs on the laptop: video, narration audio and Neo4j all local, so it
# survives the wifi-off rehearsal. This deployment exists so the 16:00 submission
# has a URL a judge can open. It differs from local in three deliberate ways:
#
#   PUBLIC_READONLY  every spend-or-destroy route 403s, Swagger and /openapi.json
#                    are off, /api/you/status is closed, and the /docs markdown
#                    mount is not registered.
#   MEDIA_URLS       the six clips are 171 MB and gitignored, so they live in a
#                    private S3 bucket and this carries presigned URLs. Render holds
#                    time-limited links, never AWS credentials. THEY EXPIRE — the
#                    signature is good for 7 days from generation; regenerate and
#                    update the env var if the link must outlive that.
#   NEO4J_*          points at Neo4j Aura rather than the local docker container.
#                    NEO4J_USER is the INSTANCE ID, not "neo4j" — Aura 2026.06 uses the
#                    instance id as the database user, and "neo4j" fails auth. Verified.
#
#                    Populate Aura by IMPORTING THE DUMP, not with `make restore`:
#                      set -a; . ./.env.aura; set +a
#                      docker cp graph/schema.cypher hackgraph:/tmp/s.cypher
#                      docker exec -e NEO4J_PASSWORD="$NEO4J_PASSWORD" hackgraph \
#                        cypher-shell -a "$NEO4J_URI" -u "$NEO4J_USER" -f /tmp/s.cypher
#                      .venv/bin/python graph/import_dump.py
#
#                    DO NOT point `make restore` at Aura. Its clean-graph, schema and
#                    seed steps run through `docker exec hackgraph cypher-shell`, which
#                    always hits the LOCAL container regardless of NEO4J_URI — so it
#                    would wipe the demo graph while writing only some steps to Aura.
#                    The import is also exact and free: no TwelveLabs calls, no ~95
#                    model calls, and it carries the Observations, the corroboration
#                    edges and the signed attestations rather than re-deriving them.
#
# Every value below marked sync:false is set in the Render dashboard or via the API,
# never committed.

services:
  - type: web
    name: hack-video
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    # Deliberately the static index, not a graph endpoint: the service must come up
    # healthy before Aura exists, otherwise the first deploy fails on a missing database.
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.12"
      - key: PUBLIC_READONLY
        value: "1"
      # Without this the process will not import — server.py reads it at module level.
      - key: TWELVELABS_API_KEY
        sync: false
      - key: YDC_API_KEY
        sync: false
      - key: MEDIA_URLS
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
